on:
  push:
    branches:
      - main
    paths:
      - 'flake.lock'
      - 'nix/modules/**/*.nix'
      - 'nix/configs/thelessone/**/*.nix'
  workflow_dispatch:

jobs:
  build:
    runs-on: native
    outputs:
      generation: ${{ steps.build.outputs.path }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build generation
        id: build
        run: >
          nix build .#nixosConfigurations.thelessone.config.system.build.toplevel -L

          echo "path=$(readlink -f ./result)" >> $FORGEJO_OUTPUT

  diff:
    runs-on: native
    needs: build
    steps:
      - name: Diff
        run: dix -v /run/current-system "${{ needs.build.outputs.generation }}"

  deployment:
    runs-on: native
    needs: build
    env:
      DEPLOYMENT_KEY_THELESSNAS: ${{ secrets.DEPLOYMENT_KEY_THELESSNAS }}
    steps:
      - name: Check current generation
        id: check-gen
        run: |
          set -x

          CURRENT_GEN="$(readlink /nix/var/nix/profiles/system | grep -oP 'system-\K\d+')"
          echo "previous=$CURRENT_GEN" >> $FORGEJO_OUTPUT

      - name: Deploy
        run: |
          eval "$(ssh-agent -s)"
          ssh-add <(echo "$DEPLOYMENT_KEY_THELESSNAS")

          ssh -T root@10.0.0.6 << 'EOF'
            tmux new-session -d -s deploy '
              set -e;

              eval "$(ssh-agent -s)";
              ssh-add /root/.ssh/id_thelessone_deployment;

              ssh root@10.0.0.5 "
                sudo nix-env -p /nix/var/nix/profiles/system --set ${{ needs.build.outputs.generation }};
                ${{ needs.build.outputs.generation }}/bin/switch-to-configuration switch
                ${{ needs.build.outputs.generation }}/bin/switch-to-configuration boot
              "
            '
          EOF

          touch recent.txt
          while ssh -T root@10.0.0.6 tmux ls 2> /dev/null | grep -q 'deploy:'; do
            cp recent.txt prev.txt
            ssh -T root@10.0.0.6 tmux capture-pane -pS - > recent.txt || break
            TMUX_OUTPUT="$(cat recent.txt)"
            TMUX_OUTPUT="${TMUX_OUTPUT##"$(cat prev.txt)"}"
            [[ -n $TMUX_OUTPUT ]] && echo "$TMUX_OUTPUT"
          done

      - name: Check generation deployed
        env:
          PREVIOUS_GEN: ${{ steps.check-gen.outputs.previous }}
        run: |
          set -x

          echo "Waiting for 5 seconds just in case..."
          sleep 5

          CURRENT_GEN="$(readlink /nix/var/nix/profiles/system | grep -oP 'system-\K\d+')"
          [[ "$CURRENT_GEN" == "$((PREVIOUS_GEN + 1))" ]] || exit 1
